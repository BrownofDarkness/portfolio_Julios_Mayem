<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <title>KKBSECU pipeline: from camera capture to event logging</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A9BD8"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C818C"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#0D0F13"/>

  <text x="60" y="80" font-size="30" font-weight="600" fill="#E8EAEE">KKBSECU pipeline</text>
  <text x="60" y="114" font-size="19" fill="#7C818C">From camera capture to event logging</text>

  <!-- Rangée 1 : gauche → droite -->
  <g>
    <rect x="60" y="150" width="320" height="170" rx="10" fill="#12141A" stroke="#2D3240" stroke-width="2"/>
    <text x="84" y="186" font-size="16" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#5A9BD8">01</text>
    <text x="220" y="230" font-size="25" font-weight="600" fill="#E8EAEE" text-anchor="middle">HD camera</text>
    <text x="220" y="268" font-size="18" fill="#B5BAC4" text-anchor="middle">Real-time</text>
    <text x="220" y="292" font-size="18" fill="#B5BAC4" text-anchor="middle">video capture</text>
  </g>
  <g>
    <rect x="440" y="150" width="320" height="170" rx="10" fill="#12141A" stroke="#2D3240" stroke-width="2"/>
    <text x="464" y="186" font-size="16" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#5A9BD8">02</text>
    <text x="600" y="230" font-size="25" font-weight="600" fill="#E8EAEE" text-anchor="middle">OpenCV</text>
    <text x="600" y="268" font-size="18" fill="#B5BAC4" text-anchor="middle">Acquisition and</text>
    <text x="600" y="292" font-size="18" fill="#B5BAC4" text-anchor="middle">image preprocessing</text>
  </g>
  <g>
    <rect x="820" y="150" width="320" height="170" rx="10" fill="#12141A" stroke="#2D3240" stroke-width="2"/>
    <text x="844" y="186" font-size="16" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#5A9BD8">03</text>
    <text x="980" y="230" font-size="25" font-weight="600" fill="#E8EAEE" text-anchor="middle">Face detection</text>
    <text x="980" y="268" font-size="18" fill="#B5BAC4" text-anchor="middle">Locating and</text>
    <text x="980" y="292" font-size="18" fill="#B5BAC4" text-anchor="middle">framing the face</text>
  </g>

  <line x1="384" y1="235" x2="434" y2="235" stroke="#5A9BD8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="764" y1="235" x2="814" y2="235" stroke="#5A9BD8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="980" y1="324" x2="980" y2="464" stroke="#5A9BD8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Rangée 2 : droite → gauche -->
  <g>
    <rect x="820" y="470" width="320" height="170" rx="10" fill="#12141A" stroke="#2D3240" stroke-width="2"/>
    <text x="844" y="506" font-size="16" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#5A9BD8">04</text>
    <text x="980" y="550" font-size="25" font-weight="600" fill="#E8EAEE" text-anchor="middle">Recognition</text>
    <text x="980" y="588" font-size="18" fill="#B5BAC4" text-anchor="middle">Matching against</text>
    <text x="980" y="612" font-size="18" fill="#B5BAC4" text-anchor="middle">the trained model</text>
  </g>
  <g>
    <rect x="440" y="470" width="320" height="170" rx="10" fill="#12141A" stroke="#2D3240" stroke-width="2"/>
    <text x="464" y="506" font-size="16" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#5A9BD8">05</text>
    <text x="600" y="550" font-size="25" font-weight="600" fill="#E8EAEE" text-anchor="middle">Access decision</text>
    <text x="600" y="588" font-size="18" fill="#B5BAC4" text-anchor="middle">Granted, unknown</text>
    <text x="600" y="612" font-size="18" fill="#B5BAC4" text-anchor="middle">or intrusion</text>
  </g>
  <g>
    <rect x="60" y="470" width="320" height="170" rx="10" fill="#12141A" stroke="#4EBFC9" stroke-width="2"/>
    <text x="84" y="506" font-size="16" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#4EBFC9">06</text>
    <text x="220" y="550" font-size="25" font-weight="600" fill="#E8EAEE" text-anchor="middle">Logging</text>
    <text x="220" y="588" font-size="18" fill="#B5BAC4" text-anchor="middle">Local history</text>
    <text x="220" y="612" font-size="18" fill="#B5BAC4" text-anchor="middle">and Firebase</text>
  </g>

  <line x1="816" y1="555" x2="766" y2="555" stroke="#5A9BD8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="436" y1="555" x2="386" y2="555" stroke="#5A9BD8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Boucle de contrôle -->
  <polyline points="220,644 220,700 980,700 980,648" fill="none" stroke="#7C818C" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-dim)"/>
  <text x="600" y="742" font-size="18" fill="#7C818C" text-anchor="middle">Control loop: threshold tuning, testing, error tracking and model improvement</text>
</svg>
